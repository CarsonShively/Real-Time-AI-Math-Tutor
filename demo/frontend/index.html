<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            viewport-fit=cover
        "
    >

    <title>AI Math Tutor</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>
    <div
        id="begin-overlay"
        class="begin-overlay"
    >
        <button
            id="begin-button"
            class="begin-button"
            type="button"
        >
            Begin
        </button>
    </div>

    <main class="app-page">
        <header class="top-bar">
            <button
                id="whiteboard-button"
                class="whiteboard-button"
                type="button"
                aria-label="Open tutor whiteboard"
            >
                <span aria-hidden="true">
                    📝
                </span>

                <span>
                    Work
                </span>
            </button>

            <div
                id="checkpoint-text"
                class="checkpoint-text hidden"
                role="status"
                aria-live="polite"
            ></div>
        </header>

        <section class="camera-shell">
            <div class="camera-container">
                <video
                    id="camera"
                    autoplay
                    playsinline
                    muted
                ></video>

                <canvas
                    id="capture-canvas"
                    hidden
                ></canvas>

                <div
                    id="camera-off-message"
                    class="camera-off-message hidden"
                    role="alert"
                    aria-live="polite"
                ></div>
            </div>
        </section>

        <section
            class="controls"
            aria-label="Tutor controls"
        >
            <button
                id="camera-audio-button"
                class="control-button camera-audio-button"
                type="button"
                aria-label="Hold to speak and capture work"
                aria-pressed="false"
            >
                <span
                    class="control-icon"
                    aria-hidden="true"
                >
                    📷
                </span>

                <span class="control-label">
                    Hold for audio + work
                </span>
            </button>

            <button
                id="audio-only-button"
                class="control-button audio-only-button"
                type="button"
                aria-label="Hold to speak without taking a picture"
                aria-pressed="false"
            >
                <span
                    class="control-icon"
                    aria-hidden="true"
                >
                    🎤
                </span>

                <span class="control-label">
                    Hold for audio only
                </span>
            </button>
        </section>
    </main>

    <div
        id="whiteboard-overlay"
        class="whiteboard-overlay hidden"
        aria-hidden="true"
    >
        <section
            id="whiteboard-panel"
            class="whiteboard-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="whiteboard-title"
        >
            <button
                id="whiteboard-close-button"
                class="whiteboard-close-button"
                type="button"
                aria-label="Close whiteboard"
            >
                ×
            </button>

            <header class="whiteboard-header">
                <p class="whiteboard-eyebrow">
                    AI Math Tutor
                </p>

                <h1 id="whiteboard-title">
                    Your Work
                </h1>
            </header>

            <div class="whiteboard-content">
                <section class="whiteboard-section">
                    <h2>
                        Correct steps
                    </h2>

                    <div
                        id="correct-steps"
                        class="correct-steps"
                    >
                        <p class="empty-message">
                            Submit a picture of your work to
                            see the analyzed steps.
                        </p>
                    </div>
                </section>

                <section
                    class="
                        whiteboard-section
                        incorrect-section
                    "
                >
                    <h2>
                        First incorrect step
                    </h2>

                    <div
                        id="incorrect-step"
                        class="incorrect-step"
                    >
                        No incorrect step has been analyzed.
                    </div>
                </section>

                <section
                    class="
                        whiteboard-section
                        tutor-section
                    "
                >
                    <h2>
                        Tutor response
                    </h2>

                    <div
                        id="tutor-response"
                        class="tutor-response"
                        aria-live="polite"
                    >
                        Ask the tutor a question to begin.
                    </div>
                </section>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
