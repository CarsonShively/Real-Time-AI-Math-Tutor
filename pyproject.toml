[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "real_time_ai_math_tutor"
version = "0.1.0"
requires-python = ">=3.11, <3.14"

dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<1.9",
    "numpy>=1.26,<3",
    "tensorflow>=2.16,<3",
    "torch>=2.7,<3",
    "huggingface-hub>=1,<2",
    "datasets>=4.7,<6",
    "opencv-python>=4.13,<5",
    "scipy>=1.1,<2.0",
    "ultralytics>=8.4,<8.5",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "transformers>=5.0,<6",
    "trl>=1.8,<2"
]

[tool.setuptools.packages.find]
where = ["src"]